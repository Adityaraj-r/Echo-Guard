services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ENVIRONMENT: production
      MONGODB_URL: "mongodb://${MONGO_APP_USERNAME:?Set MONGO_APP_USERNAME in .env}:${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD in .env}@mongo:27017/echoguard?authSource=echoguard"
      DATABASE_NAME: echoguard
      CORS_ORIGINS: ${DOCKER_CORS_ORIGINS:-http://localhost:8080}
      ALLOWED_HOSTS: ${DOCKER_ALLOWED_HOSTS:-localhost,127.0.0.1,api}
      UPLOAD_DIR: /data/uploads
      TEMP_AUDIO_DIR: /data/temp_audio
      TEMP_IMAGE_DIR: /data/temp_images
      FFMPEG_PATH: /usr/bin
      MODEL_WEIGHTS_PATH: /models/echoguard_weights.pth
      MODEL_FAKE_CLASS_INDEX: 0
      MODEL_HUMAN_CLASS_INDEX: 1
      MODEL_SPECTROGRAM_MODE: new
      ALLOW_UNTRAINED_MODEL: "false"
      MODEL_FAKE_THRESHOLD: ${PRODUCTION_MODEL_FAKE_THRESHOLD:-0.75}
      MODEL_HUMAN_THRESHOLD: ${PRODUCTION_MODEL_HUMAN_THRESHOLD:-0.35}
      ENABLE_DETECTION_DELETE: ${PRODUCTION_ENABLE_DETECTION_DELETE:-false}
      MAX_UPLOAD_SIZE_MB: 25
    volumes:
      - uploads:/data/uploads
      - temp-audio:/data/temp_audio
      - temp-images:/data/temp_images
      - ./echoguard_weights.pth:/models/echoguard_weights.pth:ro
    expose:
      - "8000"
    depends_on:
      - mongo

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "8080:80"
    depends_on:
      - api

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_DATABASE: echoguard
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?Set MONGO_INITDB_ROOT_USERNAME in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?Set MONGO_INITDB_ROOT_PASSWORD in .env}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:?Set MONGO_APP_USERNAME in .env}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD in .env}
    volumes:
      - mongo-data:/data/db
      - ./docker/mongo-init/01-create-app-user.js:/docker-entrypoint-initdb.d/01-create-app-user.js:ro

volumes:
  uploads:
  temp-audio:
  temp-images:
  mongo-data:
